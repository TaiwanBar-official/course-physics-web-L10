<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>摩擦力實驗</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <header class="site-header">
    <img src="assets/images/logo.png" class="logo" alt="圖解操作理化課">   <!-- ← 新增這行 -->
     <h1 id="siteTitle">摩擦力實驗</h1>
    <button id="helpBtn" class="help-btn" type="button" aria-label="操作說明">?</button>
  </header>

  <main class="layout">
    <!-- 排版：手機依序為 動畫 → 控制區 → 紀錄；
         電腦版為左欄動畫、右上控制區、右下紀錄（見 style.css 的 grid-template-areas） -->
    <section class="card sim-card" aria-label="模擬畫面">
      <div class="stage" id="stage">
        <div class="backdrop" id="backdrop"></div>
        <div class="ground" id="ground"></div>
        <div class="canvas" id="canvas">
          <img class="layer" id="boxImg" alt="">
          <img class="layer" id="personImg" alt="">
          <svg class="layer" id="arrows" viewBox="0 0 800 500" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="values">
        <div class="value value--push">
          <span class="value-label">推力（操控變因）</span>
          <span class="value-num" id="forceValue">-</span>
        </div>
        <div class="value value--friction">
          <span class="value-label">摩擦力（應變變因）</span>
          <span class="value-num" id="frictionValue">-</span>
        </div>
      </div>

      <div class="result" id="result" hidden aria-live="polite">
        <span id="resultText"></span>
        <button type="button" class="link-btn" id="toChart"></button>
      </div>
    </section>

    <section class="card controls" aria-label="控制區">
      <div class="ctl-group">
        <p class="ctl-label">箱子質量<small>（控制變因）</small></p>
        <div class="seg" id="massSeg" role="group" aria-label="箱子質量"></div>
      </div>
      <div class="ctl-group">
        <p class="ctl-label">接觸面<small>（控制變因）</small></p>
        <div class="seg" id="surfaceSeg" role="group" aria-label="接觸面"></div>
      </div>
      <div class="ctl-group ctl-group--wide">
        <p class="ctl-label">推力<small>（操控變因）</small></p>
        <div class="force-row">
          <button type="button" class="step-btn" id="forceMinus" aria-label="推力減少">−</button>
          <input type="range" id="forceSlider" aria-label="推力大小">
          <button type="button" class="step-btn" id="forcePlus" aria-label="推力增加">＋</button>
          <output id="forceOut" for="forceSlider">0 N</output>
        </div>
      </div>
      <button type="button" class="start-btn" id="startBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg>
        <span id="startLabel">開始推</span>
      </button>
    </section>

    <section class="card chart-card" id="chartCard" aria-label="實驗紀錄">
      <div class="chart-head">
        <h2>推力－摩擦力關係圖</h2>
        <span class="count" id="recordCount"></span>
      </div>
      <div class="chart-tools">
        <span class="tools-label">刻度</span>
        <div class="seg seg--small" id="rangeButtons" role="group" aria-label="刻度範圍"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart-box">
        <canvas id="chartCanvas" aria-label="推力與摩擦力折線圖"></canvas>
        <p class="chart-empty" id="chartEmpty"></p>
      </div>
      <div class="chart-foot">
        <button type="button" class="reset-btn" id="resetBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          重置實驗
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><p id="footerText"></p></footer>

  <!-- 重置確認視窗 -->
  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <p id="confirmText" class="dialog-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn-secondary">取消</button>
        <button value="ok" class="btn-danger">清除紀錄</button>
      </div>
    </form>
  </dialog>

  <!-- 操作教學視窗 -->
  <dialog id="tutorialDialog" class="dialog">
    <button type="button" class="dialog-close" id="tutorialClose" aria-label="關閉">×</button>
    <h2 id="tutorialTitle"></h2>
    <p id="tutorialText" class="dialog-text"></p>
    <div class="dots" id="tutorialDots" aria-hidden="true"></div>
    <div class="dialog-actions">
      <button type="button" class="btn-secondary" id="tutorialPrev">上一步</button>
      <button type="button" class="btn-primary" id="tutorialNext">下一步</button>
    </div>
  </dialog>

  <!-- 載入順序很重要：設定 → 圖表函式庫 → 各模組 → 總指揮 -->
  <script src="js/config.js"></script>
  <script src="js/vendor/chart.umd.min.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
